services:
  web:
    build: .
    image: test-web:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - next-cache:/app/.next/cache
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  next-cache:
